apiVersion: syntara.io/v1alpha1
kind: StepType

metadata:
  name: subworkflow_trigger
  displayName: Sub-Workflow Trigger
  version: 1.0.0
  icon: bolt
  description: Child-side entry trigger that makes a workflow eligible for Reference-mode subworkflow invocation.
  tags:
    - category:trigger
    - execution:in-process
    - subworkflow:reference-mode
  author: Syntara Team
  license: Apache-2.0

spec:
  category: trigger
  execution:
    type: in_process
    image: null
    entrypoint: null

  inputs:
    type: object
    properties:
      input_variables:
        type: object
        description: Required input variables declared by the child workflow and supplied by its parent caller.
        additionalProperties: true
    required: [input_variables]

  outputs:
    allOf:
      - $ref: ../../schemas/common-definitions.json#/definitions/StandardOutputWrapper

  executionTimeout: 3660
