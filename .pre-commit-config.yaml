repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: uv run mypy sdk-python/syntara_sdk tools/syntara_tools
        language: system
        pass_filenames: false
