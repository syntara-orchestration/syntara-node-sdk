name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --no-install-project --no-build
      - run: PYTHONPATH=sdk-python:tools uv run --no-sync --no-build pytest

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --no-install-project --no-build
      - run: uv run --no-sync --no-build pre-commit run --all-files
