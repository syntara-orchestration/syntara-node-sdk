apiVersion: syntara.io/v1alpha1
kind: NodeType
metadata:
  name: tfe_upload_configuration_version
  displayName: 'TFE: Upload Configuration Version'
  version: 0.1.0
  icon: cloud
  description: Upload Configuration Version through the Terraform Enterprise API.
  tags:
  - integration:terraform-enterprise
  - category:action
  - domain:configuration
  license: Apache-2.0
spec:
  category: action
  execution:
    type: container
    image: localhost:5000/syntara/tfe-executor:0.1.0
    entrypoint: python -m tfe_nodes.runner upload_configuration_version
  declaredRequirements:
    capabilities:
    - network-egress
    - readonly-root-filesystem
    credentialTypes:
    - bearer_token
  credentialSpecification:
    workloadClassification: action
  inputs:
    additionalProperties: false
    properties:
      base_url:
        description: TFE HTTPS origin, optionally ending in /api/v2
        title: Base Url
        type: string
      credential_id:
        description: Platform credential reference; never the token
        format: uuid
        title: Credential Id
        type: string
      timeout_seconds:
        default: 30
        maximum: 300
        minimum: 1
        title: Timeout Seconds
        type: integer
      workspace_id:
        minLength: 1
        pattern: ^[A-Za-z0-9_-]+$
        title: Workspace Id
        type: string
      archive_base64:
        description: Base64-encoded tar.gz configuration archive (maximum decoded
          size 64 MiB)
        maxLength: 90000000
        minLength: 1
        secret: true
        title: Archive Base64
        type: string
      auto_queue_runs:
        default: false
        title: Auto Queue Runs
        type: boolean
      speculative:
        default: false
        title: Speculative
        type: boolean
    required:
    - base_url
    - credential_id
    - workspace_id
    - archive_base64
    title: UploadConfiguration
    type: object
  outputs:
    allOf:
    - $ref: ../../../schemas/common-definitions.json#/definitions/StandardOutputWrapper
    - type: object
      properties:
        Result:
          anyOf:
          - properties:
              operation:
                title: Operation
                type: string
              data:
                default: null
                title: Data
              related:
                additionalProperties: true
                title: Related
                type: object
              meta:
                additionalProperties: true
                title: Meta
                type: object
              http_status:
                title: Http Status
                type: integer
            required:
            - operation
            - http_status
            title: TFEResult
            type: object
          - type: 'null'
  executionTimeout: 900
  resourceRequirements:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
