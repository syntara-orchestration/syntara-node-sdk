[project]
name = "syntara-step-sdk"
version = "0.1.0"
description = "Schema-driven framework for authoring, packaging, and registering workflow steps"
authors = [
    {name = "Syntara Team"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "sqlmodel>=0.0.14",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "types-pyyaml",
    "respx>=0.21",  # HTTP mocking for step unit tests
]

[project.urls]
Homepage = "https://github.com/syntara-orchestration/syntara-plugin-sdk"
Documentation = "https://github.com/syntara-orchestration/syntara-plugin-sdk/blob/devel/docs/architecture.md"
Repository = "https://github.com/syntara-orchestration/syntara-plugin-sdk"
Issues = "https://github.com/syntara-orchestration/syntara-plugin-sdk/issues"

[project.scripts]
syntara-sdk = "syntara_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk-python/syntara_sdk", "tools/syntara_tools"]
force-include = { "schemas/common-definitions.json" = "syntara_tools/schemas/common-definitions.json" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002", "ANN202", "ANN401", "C901", "COM812", "CPY001", "D100", "D101",
    "D102", "D103", "D105", "D107", "D200", "D202", "D203", "D205", "D209",
    "D212", "D213", "D400", "D413", "D415", "DTZ003", "E501", "EM101", "EM102",
    "EXE001", "FBT001", "FIX002", "FLY002", "G004", "N818", "PLC0415", "PLR0912",
    "PLR0913", "PLR0915", "PLR1714", "PLR2004", "PLR0917", "PLW1510", "PTH101",
    "PTH103", "PTH108", "PTH110", "PTH123", "PT018", "PYI034", "Q000", "Q001", "RET504",
    "RET505", "RUF005", "RUF010", "RUF022", "RUF043", "RUF100", "S101", "S103",
    "S104", "S106", "S108", "T201", "TC003", "TC006", "TRY003", "TRY004", "TRY300",
    "TRY301", "TRY400",
    "D404",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "INP001", "S101", "ANN001", "ANN201", "D102", "D103", "PLR2004",
    "TD002", "TD003", "ARG001", "ARG002", "SLF001", "PERF401", "S110",
    "BLE001", "SIM105", "PLC0415", "D401", "PT011", "PT012", "PGH003", "SIM117",
    "S603", "S607",
]
"**/__init__.py" = ["F401", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
