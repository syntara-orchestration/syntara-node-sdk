[project]
name = "syntara-node-sdk"
version = "0.1.0"
description = "Schema-driven framework for authoring, packaging, and registering custom automation nodes"
authors = [
    {name = "Syntara Team"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "sqlmodel>=0.0.14",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://github.com/yourusername/syntara-node-sdk"
Documentation = "https://github.com/yourusername/syntara-node-sdk/blob/main/docs/architecture.md"
Repository = "https://github.com/yourusername/syntara-node-sdk"
Issues = "https://github.com/yourusername/syntara-node-sdk/issues"

[project.scripts]
syntara-cli = "syntara_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk-python/syntara_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
