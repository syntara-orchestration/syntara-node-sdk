[project]
name = "syntara-plugin-contracts"
version = "0.1.0"
description = "Versioned contracts and deterministic bundles for Syntara plugins"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_plugin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
