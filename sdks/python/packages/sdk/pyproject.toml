[project]
name = "syntara-plugin-sdk"
version = "0.1.0"
description = "Authoring SDK for Syntara plugins"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "syntara-plugin-contracts>=0.1.0",
  "syntara-plugin-runtime>=0.1.0",
]

[tool.uv.sources]
syntara-plugin-contracts = { workspace = true }
syntara-plugin-runtime = { workspace = true }

[project.scripts]
syntara-plugin = "syntara_plugin.sdk.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_plugin"]
